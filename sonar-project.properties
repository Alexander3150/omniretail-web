# Configuracion de SonarQube Cloud. organization y projectKey llegan desde el workflow (variables de GitHub).
sonar.host.url=https://sonarcloud.io
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.d.ts
sonar.sourceEncoding=UTF-8

# Pruebas unitarias (vitest) y cobertura LCOV generada por `npm run test:coverage` en el CI.
# La cobertura de codigo nuevo se mide solo sobre src; los tests y los scripts no cuentan.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,scripts/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
